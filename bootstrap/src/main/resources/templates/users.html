<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <title>Users</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
</head>
<body>
    <div class="container">
        <h1>Users</h1>
        <table class="table table-striped">
            <thead>
                <tr>
                </tr>
            </thead>
            <tbody>
                <tr th:each="user : ${users}">
                    <td th:text="${user.userId}"></td>
                    <td th:text="${user.username}"></td>
                    <td>
                        <div class="btn-group" role="group">
                            <a th:href="@{'/users/edit/' + ${user.userId}}" class="btn btn-warning" sec:authorize="hasRole('ADMIN')">Edit</a>
                            <form th:action="@{'/users/delete/' + ${user.userId}}" method="post" style="display:inline;" sec:authorize="hasRole('ADMIN')">
                                <button type="submit" class="btn btn-danger">Delete</button>
                            </form>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(users)}">
                    <td colspan="6">No users found</td>
                </tr>
            </tbody>
        </table>

        <div sec:authorize="hasRole('ADMIN')">
            <a th:href="@{/users/create}" class="btn btn-primary">Add User</a>
        </div>
		<div sec:authorize="hasRole('ADMIN')">
					    <a th:href="@{/users/delete/{id}}" class="btn btn-warning">Delete Subject</a>
					</div>
					
						<div sec:authorize="hasRole('ADMIN')">
						    <a th:href="@{/users/edit/{id}}" class="btn btn-warning">Update Subject</a>
						</div>
        <div>
            <a th:href="@{/welcome}" class="btn btn-secondary">Back to Welcome</a>
        </div>
    </div>

    <script th:src="@{/webjars/jquery/jquery.min.js}"></script>
    <script th:src="@{/webjars/bootstrap/js/bootstrap.min.js}"></script>
</body>
</html>
