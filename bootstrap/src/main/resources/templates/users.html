<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <title>Create User</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
</head>
<body>
    <h1 th:text="${editMode} ? 'Edit User' : 'Create a New User'"></h1>
    <form th:action="${editMode} ? @{/users/edit/{id}(id=${user.userId})} : @{/users/create}" 
          th:object="${user}" method="post">
        
        <input type="hidden" th:if="${editMode}" th:field="*{userId}" />
        
        <div>
            <label for="username">Username:</label>
            <input type="text" id="username" th:field="*{username}" required>
        </div>
        <div>
            <label for="password">Password:</label>
            <input type="password" id="password" th:field="*{password}" 
                   th:attr="disabled=${editMode}" required>
        </div>
        <div>
            <label for="role">Role:</label>
            <select id="role" th:field="*{role}" required>
                <option th:each="role : ${T(ua.foxminded.bootstrap.model.enummodel.Role).values()}"
                        th:value="${role}" 
                        th:text="${role}">
                </option>
            </select>
        </div>

        <div>
            <button type="submit" th:text="${editMode} ? 'Update' : 'Create'"></button>
        </div>
    </form>
</body>
</html>
