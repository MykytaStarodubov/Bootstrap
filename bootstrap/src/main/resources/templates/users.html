<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <title>Create User</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
</head>
<body>
    <h1 th:text="${editMode} ? 'Edit User' : 'Create a New User'"></h1>
    <form th:action="${editMode} ? @{/users/edit/{id}(id=${user.userId})} : @{/users/create}" 
          th:object="${user}" method="post">
        
        <input type="hidden" th:if="${editMode}" th:field="*{userId}" />
        
        <div>
            <label for="username">Username:</label>
            <input type="text" id="username" th:field="*{username}" required>
        </div>
        <div>
            <label for="password">Password:</label>
            <input type="password" id="password" th:field="*{password}" 
                   th:attr="disabled=${editMode}" required>
        </div>
        <div>
            <label for="role">Role:</label>
            <select id="role" th:field="*{role}" required>
                <option th:each="role : ${T(ua.foxminded.bootstrap.model.enummodel.Role).values()}"
                        th:value="${role}" 
                        th:text="${role}">
                </option>
            </select>
        </div>

        <div>
            <button type="submit" th:text="${editMode} ? 'Update' : 'Create'"></button>
        </div>
    </form>

    <h2>Users List</h2>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Username</th>
                <th>Role</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="user : ${users}">
                <td th:text="${user.userId}"></td>
                <td th:text="${user.username}"></td>
                <td th:text="${user.role}"></td>
                <td>
                    <a th:href="@{/users/edit/{id}(id=${user.userId})}">Edit</a>
                    <form th:action="@{/users/delete/{id}(id=${user.userId})}" method="post">
                        <input type="hidden" name="_method" value="delete" />
                        <button type="submit">Delete</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>

</body>
</html>
