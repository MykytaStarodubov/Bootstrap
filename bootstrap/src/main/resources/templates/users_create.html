<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <title>Create User</title>
</head>
<body>
    <h1>Create a New User</h1>
    <form th:action="@{/users/create}" th:object="${user}" method="post">
        <div>
            <label for="username">Username:</label>
            <input type="text" id="username" th:field="*{username}" required>
        </div>
        <div>
            <label for="password">Password:</label>
            <input type="password" id="password" th:field="*{password}" required>
        </div>

        <!--TODO: role cannot be null in USER model, please consider default value here -->
        <!-- WHY using fields which not exists in model, like email, address, date of birth ? -->
        <div>
            <input type="hidden" id="role" th:field="*{role}" th:value="'STUDENT'" required>
        </div>
        <div>
            <button type="submit">Create</button>
        </div>
    </form>
</body>
</html>
