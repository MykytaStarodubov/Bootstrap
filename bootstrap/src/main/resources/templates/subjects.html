<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <title>Subjects</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
</head>
<body>
    <div class="container">
        <h1>Subjects</h1>
        <table class="table table-striped">
            <thead>       
            </thead>
            <tbody>
                <tr th:each="subject : ${subjects}">
                    <td th:text="${subject.subjectId}"></td>
                    <td th:text="${subject.subjectName}"></td>
                    <td th:text="${subject.subjectDescription}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(subjects)}">
                    <td colspan="4">No subjects found</td>
                </tr>
            </tbody>
        </table>
		
        <div sec:authorize="hasRole('ADMIN')">
            <a th:href="@{/subjects/create}" class="btn btn-primary">Add Subject</a>
        </div>
		
		<div sec:authorize="hasRole('ADMIN')">
		    <a th:href="@{/subjects//delete/{id}}" class="btn btn-warning">Delete Subject</a>
		</div>
		
			<div sec:authorize="hasRole('ADMIN')">
			    <a th:href="@{/subjects/edit/{id}}" class="btn btn-warning">Update Subject</a>
			</div>
			
			<div>
			<a th:href="@{/welcome}" class="btn btn-secondary">Back to Welcome</a>
			</div>
    </div>

    <script th:src="@{/webjars/jquery/jquery.min.js}"></script>
    <script th:src="@{/webjars/bootstrap/js/bootstrap.min.js}"></script>
</body>
</html>
