<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Roles</title>
</head>
<body>
    <h1>Roles</h1>
    <table>
        <thead>
            
        </thead>
        <tbody>
            <tr th:each="role : ${roles}">
                <td th:text="${role.roleId}">1</td>
                <td th:text="${role.name}">Admin</td>
            </tr>
			   <div>
				   <a th:href="@{/welcome}" class="btn btn-secondary">Back to Welcome</a>
				</div>
        </tbody>
    </table>
</body>
</html>
