<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Classes</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
</head>
<body>
    <div class="container">
        <h1>Classes</h1>
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Description</th>
                    <th>Type</th>
                    <th>Student ID</th>
                    <th>Room</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="class : ${classes}">
                    <td th:text="${class.classId}">1</td>
                    <td th:text="${class.className}">Math Class</td>
                    <td th:text="${class.classDescription}">Math Class Description</td>
                    <td th:text="${class.classType}">Lecture</td>
                    <td th:text="${class.classStudentId}">1</td>
                    <td th:text="${class.classRoom}">Room 101</td>
                </tr>
            </tbody>
        </table>
    </div>
    <script th:src="@{/webjars/jquery/jquery.min.js}"></script>
    <script th:src="@{/webjars/bootstrap/js/bootstrap.min.js}"></script>
</body>
</html>
