<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <title th:text="${editMode} ? 'Edit Subject' : 'Create a New Subject'"></title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
</head>
<body>
    <div class="container">
        <h1 th:text="${editMode} ? 'Edit Subject' : 'Create a New Subject'"></h1>

        <form th:action="${editMode} ? @{/subjects/edit/{id}(id=${subject.subjectId})} : @{/subjects/create}" 
              th:object="${subject}" method="post">
            
            <input type="hidden" th:if="${editMode}" th:field="*{subjectId}" />
            
            <div class="form-group">
                <label for="subjectName">Subject Name:</label>
                <input type="text" id="subjectName" th:field="*{subjectName}" class="form-control" required>
            </div>
            
            <div class="form-group">
                <label for="subjectType">Subject Type:</label>
                <input type="text" id="subjectType" th:field="*{subjectType}" class="form-control">
            </div>
            
            <div class="form-group">
                <label for="subjectDescription">Subject Description:</label>
                <input type="text" id="subjectDescription" th:field="*{subjectDescription}" class="form-control">
            </div>

            <div>
                <button type="submit" class="btn btn-primary" th:text="${editMode} ? 'Update' : 'Create'"></button>
            </div>
        </form>

        <div class="mt-3">
            <a th:href="@{/subjects}" class="btn btn-secondary">Back to Subjects</a>
        </div>
    </div>

    <script th:src="@{/webjars/jquery/jquery.min.js}"></script>
    <script th:src="@{/webjars/bootstrap/js/bootstrap.min.js}"></script>
</body>
</html>
