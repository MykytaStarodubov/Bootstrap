<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <title>Students</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
</head>
<body>
    <div class="container">
        <h1>Students</h1>
        <table class="table table-striped">
            <thead>
                <tr>
                </tr>
            </thead>
            <tbody>
                <tr th:if="${#lists.isEmpty(students)}">
                    <td colspan="8">No students found</td>
                </tr>
            </tbody>
        </table>

        <div sec:authorize="hasRole('ADMIN')">
            <a th:href="@{/students/create}" class="btn btn-primary">Add Student</a>
        </div>

        <div sec:authorize="hasRole('ADMIN')">
            <a th:href="@{/students/delete/{id}}" class="btn btn-warning">Delete Student</a>
        </div>

        <div sec:authorize="hasRole('ADMIN')">
            <a th:href="@{/students/edit/{id}}" class="btn btn-warning">Update Student</a>
        </div>

        <div>
            <a th:href="@{/welcome}" class="btn btn-secondary">Back to Welcome</a>
        </div>
    </div>

    <script th:src="@{/webjars/jquery/jquery.min.js}"></script>
    <script th:src="@{/webjars/bootstrap/js/bootstrap.min.js}"></script>
</body>
</html>
