<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <title>Students</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
</head>
<body>
    <div class="container">
        <h1>Students</h1>
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:if="${#lists.isEmpty(students)}">
                    <td colspan="3">No students found</td>
                </tr>
                <tr th:each="student : ${students}">
                    <td th:text="${student.studentId}"></td>
                    <td th:text="${student.studentName}" th:if="${student.studentId != selectedStudent?.studentId}"></td>
                    
                    <td th:if="${student.studentId == selectedStudent?.studentId}">
                        <form th:action="@{/students/edit/{id}(id=${student.studentId})}" method="post">
                            <input type="hidden" name="studentId" th:value="${student.studentId}">
                            <input type="text" name="studentName" th:value="${student.studentName}" required>
                            <button type="submit" class="btn btn-success">Save</button>
                        </form>
                    </td>

                    <td>
                        <div sec:authorize="hasRole('ADMIN')">
                            <a th:href="@{/students(id=${student.studentId})}" class="btn btn-warning">Update</a>
                            <form th:action="@{/students/delete/{id}(id=${student.studentId})}" method="post" style="display:inline;">
                                <button type="submit" class="btn btn-danger">Delete</button>
                            </form>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>

        <div sec:authorize="hasRole('ADMIN')">
            <a th:href="@{/students/create}" class="btn btn-primary">Add Student</a>
        </div>

        <div>
            <a th:href="@{/welcome}" class="btn btn-secondary">Back to Welcome</a>
        </div>
    </div>

    <script th:src="@{/webjars/jquery/jquery.min.js}"></script>
    <script th:src="@{/webjars/bootstrap/js/bootstrap.min.js}"></script>
</body>
</html>
