<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create Student</title>
</head>
<body>
<h1>Create a new Student</h1>

<form th:action="@{/students/create}" th:object="${student}" method="post">
    <div>
        <label for="studentName">Student Name:</label>
        <input type="text" id="studentName" th:field="*{studentName}" required>
    </div>
    <div>
        <label for="studentMobile">Student Mobile:</label>
        <input type="text" id="studentMobile" th:field="*{studentMobile}" required>
    </div>
    <div>
        <label for="studentEmail">Student Email:</label>
        <input type="email" id="studentEmail" th:field="*{studentEmail}" required>
    </div>
    <div>
        <label for="studentAddress">Student Address:</label>
        <input type="text" id="studentAddress" th:field="*{studentAddress}">
    </div>
    <div>
        <label for="studentUsername">Student Username:</label>
        <input type="text" id="studentUsername" th:field="*{studentUsername}" required>
    </div>
    <div>
        <label for="studentPassword">Student Password:</label>
        <input type="password" id="studentPassword" th:field="*{studentPassword}" required>
    </div>
    <div>
        <label for="studentCollegeId">College ID:</label>
        <input type="text" id="studentCollegeId" th:field="*{studentCollegeId}">
    </div>
    <div>
        <button type="submit">Create</button>
    </div>
</form>
</body>
</html>
